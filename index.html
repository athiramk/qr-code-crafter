<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Start Single Page Apps for GitHub Pages -->
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
    <!-- End Single Page Apps for GitHub Pages -->

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Primary Meta Tags -->
    <title>QR Code Crafter — Free QR Code Generator for Contacts & Links</title>
    <meta name="description" content="Create customizable QR codes for vCards and URLs instantly. Free, private, and no sign-up required. Download as PNG." />
    <meta name="author" content="athiramk" />
    <meta name="keywords" content="QR code generator, vCard QR code, URL QR code, free QR code, contact QR code, link QR code" />
    <link rel="canonical" href="https://athiramk.com/qr-code-crafter/" />
    <link rel="icon" href="/qr-code-crafter/favicon.ico" />

    <!-- Open Graph -->
    <meta property="og:title" content="QR Code Crafter — Free QR Code Generator" />
    <meta property="og:description" content="Generate beautiful, customizable QR codes for contacts and links. Free, instant, and private." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://athiramk.com/qr-code-crafter/" />
    <meta property="og:site_name" content="QR Code Crafter" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="QR Code Crafter — Free QR Code Generator" />
    <meta name="twitter:description" content="Generate beautiful, customizable QR codes for contacts and links. Free, instant, and private." />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "QR Code Crafter",
      "url": "https://athiramk.com/qr-code-crafter/",
      "description": "Create customizable QR codes for vCards and URLs instantly. Free, private, and no sign-up required.",
      "applicationCategory": "UtilityApplication",
      "operatingSystem": "Any",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "featureList": ["vCard QR codes", "URL QR codes", "Custom colors", "Multiple sizes", "PNG download"]
    }
    </script>

    <!-- Robots -->
    <meta name="robots" content="index, follow" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
